<style>body{margin:0;padding:16px;background:#151613;color:#f4f4ef;font:14px system-ui}input{box-sizing:border-box;width:100%;padding:9px;background:#20211e;color:inherit}</style><label>Filter report <input id="filter" aria-label="Filter report"></label><pre id="report"></pre><script>let ctx,state={query:'',pinned:false};const send=kind=>parent.postMessage({protocol:'opensaddle.application.v1',kind,nonce:ctx.nonce,generation:ctx.generation,instance_id:ctx.instance_id,connection_key:ctx.connection_key,package_ref:ctx.package_ref,state},'*');addEventListener('message',event=>{const m=event.data;if(event.source!==parent||m?.kind!=='init')return;ctx=m;state=m.state||state;const input=document.querySelector('#filter');input.value=state.query;const render=()=>document.querySelector('#report').textContent=ctx.projection.text.split('\n').filter(x=>!state.query||x.toLowerCase().includes(state.query.toLowerCase())).join('\n');input.oninput=()=>{state.query=input.value;render();send('state')};render();send('ready')},{once:true})</script>
