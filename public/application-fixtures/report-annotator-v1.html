<style>body{margin:0;padding:16px;background:#151613;color:#f4f4ef;font:14px system-ui}input{box-sizing:border-box;width:100%;padding:9px;border:1px solid #555;border-radius:7px;background:#20211e;color:inherit}mark{background:#706020;color:white}p{line-height:1.5}.note{margin-top:12px;color:#bbb}</style><label>Filter report <input id="filter" aria-label="Filter report"></label><div id="report"></div><button id="network">Test blocked network</button><button id="navigate">Test blocked navigation</button><output id="probe"></output><p class="note" id="note"></p><script>
let ctx,state={filter:'',note:''};const send=(kind,payload={})=>parent.postMessage({protocol:'opensaddle.application.v1',kind,nonce:ctx.nonce,generation:ctx.generation,instance_id:ctx.instance_id,connection_key:ctx.connection_key,package_ref:ctx.package_ref,...payload},'*');const render=()=>{const q=state.filter.toLowerCase(),lines=ctx.projection.text.split(/\r?\n/).filter(x=>!q||x.toLowerCase().includes(q));document.querySelector('#report').replaceChildren(...lines.map(line=>{const p=document.createElement('p');p.textContent=line;return p}));document.querySelector('#note').textContent=state.note||'Annotations stay with this application instance.'};addEventListener('message',event=>{const m=event.data;if(event.source!==parent||m?.protocol!=='opensaddle.application.v1'||m.kind!=='init')return;ctx=m;state=m.state||state;document.querySelector('#filter').value=state.filter;document.querySelector('#filter').oninput=e=>{state.filter=e.target.value;render();send('state',{state})};document.querySelector('#network').onclick=async()=>{try{await fetch('https://example.com/probe');document.querySelector('#probe').textContent='network escaped'}catch{document.querySelector('#probe').textContent='network blocked'}};document.querySelector('#navigate').onclick=()=>{location.href='https://example.com/escape'};render();send('ready')},{once:true});
</script>
